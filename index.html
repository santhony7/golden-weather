<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golden Weather">
<meta name="theme-color" content="#305f90">
<title>Golden Weather</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:white;background:linear-gradient(160deg,#2e5c8c 0%,#4c79a6 55%,#759bc1 100%)}.dashboard{height:100%;height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:clamp(24px,8vh,90px);padding:max(5vh,env(safe-area-inset-top)) max(5.5vw,env(safe-area-inset-right)) max(5vh,env(safe-area-inset-bottom)) max(5.5vw,env(safe-area-inset-left))}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;width:78%;max-width:1200px;margin:0 auto}.city{font-size:clamp(32px,5vw,76px);font-weight:600;letter-spacing:-.03em}.location{width:.64em;height:.64em;margin-left:.16em;vertical-align:.05em}.temperature{font-size:clamp(96px,15vw,220px);font-weight:200;letter-spacing:-.065em;line-height:1.03}.conditions{text-align:right;display:flex;flex-direction:column;align-items:flex-end;font-size:clamp(27px,4.2vw,62px);font-weight:400;line-height:1.25;padding-top:.3em}.conditions .icon{width:clamp(48px,6vw,90px);height:clamp(38px,5vw,70px);margin-bottom:.3em}.highlow{white-space:nowrap}.hourly{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1vw;align-items:end;text-align:center}.hour{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.2vh,25px);min-width:0}.time{font-size:clamp(16px,2.8vw,38px);font-weight:500;color:#d0dfed;white-space:nowrap}.hour .icon{width:clamp(29px,5vw,68px);height:clamp(29px,5vw,68px)}.hour-temp{font-size:clamp(20px,3.3vw,46px);font-weight:500;white-space:nowrap}.low{color:#c9d9e9;margin-left:.2em}.status{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:13px;color:#e0ebf5}.status:empty{display:none}.icon svg{width:100%;height:100%;overflow:visible}@media(max-width:600px){.top{width:100%;gap:1rem}.city{font-size:clamp(25px,6vw,36px)}.temperature{font-size:clamp(72px,16vw,100px)}.conditions{font-size:clamp(21px,4.8vw,30px)}}@media(max-height:450px){.dashboard{padding-top:4vh;padding-bottom:5vh}.temperature{font-size:20vh}.city{font-size:8vh}.conditions{font-size:6vh}.hour{gap:1vh}.hour .icon{height:11vh;width:11vh}.time{font-size:5vh}.hour-temp{font-size:7vh}}
</style>
</head>
<body>
<main class="dashboard" aria-label="Weather in Golden, Colorado">
  <div class="top">
    <div><div class="city">Golden<svg class="location" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.7 2.4a1.5 1.5 0 0 0-1.6-.3L2.9 9.4c-1.3.6-1.2 2.4.2 2.8l6.4 2 2 6.5c.4 1.3 2.3 1.5 2.8.2l7.7-16.9a1.5 1.5 0 0 0-.3-1.6Z"/></svg></div><div class="temperature" id="current">--°</div></div>
    <div class="conditions"><div class="icon" id="current-icon" aria-hidden="true"></div><div id="description">Loading weather…</div><div class="highlow" id="highlow">H:--° L:--°</div></div>
  </div>
  <div class="hourly" id="daily" aria-label="Five-day forecast"></div>
</main>
<div class="status" id="status" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var url='https://api.open-meteo.com/v1/forecast?latitude=39.7555&longitude=-105.2211&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FDenver&forecast_days=5';
var $=function(id){return document.getElementById(id)};
var sun='<circle cx="32" cy="32" r="13" fill="#ffcf00"/><g stroke="#ffcf00" stroke-width="4" stroke-linecap="round"><path d="M32 3v6M32 55v6M3 32h6M55 32h6M11.5 11.5l4.3 4.3M48.2 48.2l4.3 4.3M52.5 11.5l-4.3 4.3M15.8 48.2l-4.3 4.3"/></g>';
var moon='<path d="M45 48A23 23 0 0 1 27 7a22 22 0 1 0 25 36 22 22 0 0 1-7 5Z" fill="#f8e6a0"/>';
var cloud='<path d="M16 48c-8 0-12-5-12-11s5-11 12-11c2-9 9-14 17-14 9 0 16 6 17 14 7 0 11 5 11 11s-5 11-12 11H16Z" fill="#f1f5f8"/>';
function info(code,day){if(code===0)return [day?'Sunny':'Clear',day?'sun':'moon'];if(code===1||code===2)return [day?'Partly Cloudy':'Partly Cloudy','partly'];if(code===3)return ['Cloudy','cloud'];if(code===45||code===48)return ['Foggy','fog'];if(code>=51&&code<=57)return ['Drizzle','rain'];if(code>=61&&code<=67)return [code>=66?'Freezing Rain':'Rain','rain'];if(code>=71&&code<=77)return ['Snow','snow'];if(code>=80&&code<=82)return ['Showers','rain'];if(code===85||code===86)return ['Snow Showers','snow'];if(code>=95)return ['Thunderstorms','storm'];return ['Cloudy','cloud'];}
function icon(kind,day){var s='';if(kind==='sun')s=sun;else if(kind==='moon')s=moon;else if(kind==='partly')s='<g transform="translate(14,-5) scale(.68)">'+(day?sun:moon)+'</g><g transform="translate(-3,10) scale(.82)">'+cloud+'</g>';else if(kind==='cloud')s=cloud;else if(kind==='fog')s='<g transform="translate(0,-8) scale(.9)">'+cloud+'</g><path d="M12 51h40M17 58h30" stroke="#e8f0f7" stroke-width="3" stroke-linecap="round"/>';else {s='<g transform="translate(0,-7) scale(.9)">'+cloud+'</g>';if(kind==='rain')s+='<path d="M20 46l-3 9M32 46l-3 9M44 46l-3 9" stroke="#a8ddff" stroke-width="4" stroke-linecap="round"/>';if(kind==='snow')s+='<g fill="#fff"><circle cx="19" cy="52" r="3"/><circle cx="32" cy="55" r="3"/><circle cx="45" cy="52" r="3"/></g>';if(kind==='storm')s+='<path d="M33 42l-9 12h8l-2 9 12-15h-8l3-6Z" fill="#ffcf00"/>';}return '<svg viewBox="0 0 64 64" aria-hidden="true">'+s+'</svg>';}
function temp(n){return typeof n==='number'&&isFinite(n)?Math.round(n)+'°':'--°';}
function dayLabel(date,index){if(index===0)return 'Today';var parts=date.split('-');var day=new Date(Date.UTC(+parts[0],+parts[1]-1,+parts[2])).getUTCDay();return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][day];}
function render(data){var c=data.current,d=data.daily;if(!c||!d||!d.time||!d.weather_code||!d.temperature_2m_max||!d.temperature_2m_min||d.time.length<5||d.weather_code.length<5||d.temperature_2m_max.length<5||d.temperature_2m_min.length<5)throw Error('Incomplete forecast');var condition=info(c.weather_code,c.is_day);$('current').textContent=temp(c.temperature_2m);$('description').textContent=condition[0];$('current-icon').innerHTML=icon(condition[1],c.is_day);$('highlow').textContent='H:'+temp(d.temperature_2m_max[0])+' L:'+temp(d.temperature_2m_min[0]);var html='';for(var i=0;i<5;i++){var item=info(d.weather_code[i],1),label=dayLabel(d.time[i],i),high=temp(d.temperature_2m_max[i]),low=temp(d.temperature_2m_min[i]);html+='<div class="hour" aria-label="'+label+', '+item[0]+', high '+high+', low '+low+'"><div class="time">'+label+'</div><div class="icon">'+icon(item[1],1)+'</div><div class="hour-temp">'+high+' <span class="low">'+low+'</span></div></div>'}$('daily').innerHTML=html;$('status').textContent='';}
var loaded=false,loading=false,lastAttempt=0,lastSuccess=0;
function updatedLabel(){return 'Updated '+new Intl.DateTimeFormat('en-US',{timeZone:'America/Denver',hour:'numeric',minute:'2-digit'}).format(new Date(lastSuccess));}
function refresh(force){var now=Date.now();if(loading||(!force&&now-lastAttempt<(loaded&&lastSuccess>=lastAttempt?600000:60000)))return;loading=true;lastAttempt=now;var controller=new AbortController();var timeout=setTimeout(function(){controller.abort()},20000);fetch(url+'&_='+now,{cache:'no-store',signal:controller.signal}).then(function(r){if(!r.ok)throw Error('Weather service unavailable');return r.json()}).then(function(data){render(data);loaded=true;lastSuccess=Date.now();$('status').textContent=updatedLabel()}).catch(function(){$('status').textContent=loaded?'Unable to refresh · '+updatedLabel():'Weather unavailable · Retrying shortly';if(!loaded)$('description').textContent='Weather unavailable'}).finally(function(){clearTimeout(timeout);loading=false});}
refresh(true);setInterval(function(){refresh(false)},30000);document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh(false)});window.addEventListener('pageshow',function(){refresh(false)});window.addEventListener('focus',function(){refresh(false)});window.addEventListener('online',function(){refresh(true)});
})();
</script>
</body>
</html>
